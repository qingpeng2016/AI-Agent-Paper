# 原生 ARIS /idea-discovery 平台配置（改后需重启 API + bot）
# artifacts：工作区相对路径，与已安装 ARIS /idea-discovery skill 产物约定一致
# platform：与 skill Constants 对齐，由 FormatIdeaDiscoveryArgsLine 写入 CLI prompt

artifacts:
  idea_report: idea-stage/IDEA_REPORT.md
  final_proposal: refine-logs/FINAL_PROPOSAL.md
  experiment_plan: refine-logs/EXPERIMENT_PLAN.md
  experiment_tracker: refine-logs/EXPERIMENT_TRACKER.md
  pipeline_summary: refine-logs/PIPELINE_SUMMARY.md
  research_brief: RESEARCH_BRIEF.md
  literature_dir: literature
  corpus_json: .paper/corpus.json

# 平台确定性门禁（Go 在 ARIS gate 之外再验一遍；不替代 idea_discovery_gate.py）
evidence_gate:
  min_file_bytes:
    idea-stage/IDEA_REPORT.md: 2048
    refine-logs/FINAL_PROPOSAL.md: 512
    refine-logs/EXPERIMENT_PLAN.md: 512
    refine-logs/EXPERIMENT_TRACKER.md: 256
  report_headings:
    - Literature Landscape
    - Ranked Ideas
    - Novelty Verification
    - External Critical Review
    - Executive Summary

workspace:
  inout_root: /www/wwwroot/AI-Agent-Paper-runtime/inout
  invoke_dir: .paper/invoke
  invoke_logs_dir: .paper/invoke/logs
  run_state_dir: .aris/runs

checkpoint_phases:
  research-lit:
    pause: true
    label_zh: 文献调研
  idea-creator:
    pause: true
    label_zh: 选题大纲
  novelty-check:
    pause: true
    label_zh: 新颖性检验
  research-review:
    pause: true
    label_zh: 外部审查
  research-refine-pipeline:
    pause: true
    label_zh: 文献综述与实验规划

cli_session_cleanup:
  claude: ~/.claude/sessions
  codex: ~/.codex/sessions

platform:
  # skill AUTO_PROCEED：true=同 turn 连跑；false=每 checkpoint 停 turn（平台 bot 常用 false）
  auto_proceed: false
  sources: web
  arxiv_download: false
  arxiv_max_download: 5
  max_aris_per_bot: 1
  pilot_max_hours: 2
  pilot_timeout_hours: 3
  max_pilot_ideas: 3
  max_total_gpu_hours: 8
  reviewer_model: gpt-6-astra
  output_dir: idea-stage/
  compact: false
  render_html: true
  ref_paper: ""
  resumable: true
