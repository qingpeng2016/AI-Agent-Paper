# 原生 ARIS /idea-discovery 平台配置（改后需重启 API + bot）
# artifacts：工作区相对路径，与已安装 ARIS /idea-discovery skill 产物约定一致
# platform：文献由 /research-lit 拉取；选题 idea_discovery → confirm；bot 按 auto_proceed 暂停或连跑

artifacts:
  # 主报告；gate 校验、composed 参数、结果汇总均默认指向此文件
  idea_report: idea-stage/IDEA_REPORT.md
  # refine 阶段最终方案（idea_discovery 完成后读入聚合结果）
  final_proposal: refine-logs/FINAL_PROPOSAL.md
  # 实验计划 Markdown
  experiment_plan: refine-logs/EXPERIMENT_PLAN.md
  # 实验跟踪表（仅检查文件是否存在，写入 artifact_paths）
  experiment_tracker: refine-logs/EXPERIMENT_TRACKER.md
  # 流水线摘要（同上，存在性扫描）
  pipeline_summary: refine-logs/PIPELINE_SUMMARY.md
  # 调 ARIS 前由平台生成的研究方向 brief
  research_brief: RESEARCH_BRIEF.md
  # 本地 PDF 库目录名；CLI 会拼 paper library: <paperRoot>/literature
  literature_dir: literature
  # 语料索引路径（/research-lit 可写入；ingest 时可选读标题/URL）
  corpus_json: .paper/corpus.json

# 相对 inout/user_*/manuscript_*/run_*/paper/ 的平台路径（主根 = paperRoot，后续 ARIS skill 共用）
workspace:
  # ARIS invoke 元数据：request.json、platform_user_prompt.txt、contract 等
  invoke_dir: .paper/invoke
  # Claude/ARIS CLI 流式日志、latest_aris_cli.log、invoke_errors.log
  invoke_logs_dir: .paper/invoke/logs
  # run 状态 JSON（由 aris /idea-discovery 写入）：{run_state_dir}/{run_id}.json
  run_state_dir: .aris/runs

# /idea-discovery run_state 各 ARIS phase（顺序与 skill 一致）
# pause：true=该 phase 前后需平台 Continue；false=可与相邻 false 合并为一段 UI 展示
# label_zh：工作台分段进度等前端展示用中文名
checkpoint_phases:
  research-lit:
    pause: true
    label_zh: 文献调研
  idea-creator:
    pause: true
    label_zh: 选题大纲
  novelty-check:
    pause: true
    label_zh: 新颖性检验
  research-review:
    pause: true
    label_zh: 外部审查
  research-refine-pipeline:
    pause: true
    label_zh: 文献综述与实验规划

# 每次 runARISCLI 前：删 paperRoot/.claude/sessions 与 .claude/.codex，并在下列目录删「内容含本 run 路径」的全局 session 文件
cli_session_cleanup:
  claude: ~/.claude/sessions
  codex: ~/.codex/sessions

platform:
  # 传给 skill 的 AUTO_PROCEED（与 checkpoint_phases.pause 独立：前者管 skill 内行为，后者管平台段间是否停）
  auto_proceed: false
  # 传给 skill 的 sources（如 local、web）；web 时由 /research-lit 联网检索
  sources: web
  # 是否下载 arXiv PDF 到 literature_dir（CLI 参数 ARXIV_DOWNLOAD: true/false）
  arxiv_download: true
  # 单次文献阶段最多下载几篇 PDF（CLI 参数 ARXIV_MAX_DOWNLOAD: <N>；仅 arxiv_download: true 时生效）
  arxiv_max_download: 5
  # 每 bot tick 最多 1 次 aris；段内 drain 时 invoke 后保留 async_llm，由下一轮 scheduler 再跑
  max_aris_per_bot: 1
