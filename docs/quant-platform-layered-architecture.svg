  <text x="795" y="134" class="txt-sm">待人工部署 · 不自动换版</text>
  <path d="M600 150 L600 168" class="arrow"/>
  <text x="24" y="182" class="layer-label">L1 · Agent 层（逻辑角色）</text>
  <rect x="28" y="192" width="148" height="64" rx="4" class="box-agent"/>
  <text x="102" y="216" class="txt">① 任务协调</text>
