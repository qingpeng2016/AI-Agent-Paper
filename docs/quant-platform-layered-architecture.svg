  <text x="130" y="562" class="txt-sm">plugins/strategies</text>
  <rect x="252" y="522" width="220" height="56" rx="4" class="box-plugin"/>
  <text x="362" y="546" class="txt">数据源插件</text>
  <text x="362" y="562" class="txt-sm">数据中心 / 多源接入</text>
  <rect x="484" y="522" width="220" height="56" rx="4" class="box-plugin"/>
  <text x="594" y="546" class="txt">市场规则插件</text>
  <text x="594" y="562" class="txt-sm">T+1 · 合约 · 费用</text>
  <rect x="716" y="522" width="220" height="56" rx="4" class="box-plugin"/>
  <text x="826" y="546" class="txt">检验插件</text>
  <text x="826" y="562" class="txt-sm">样本外 · 扰动 G6</text>
  <rect x="948" y="522" width="232" height="56" rx="4" class="box-plugin"/>
  <text x="1064" y="546" class="txt">各大交易所插件</text>
  <text x="1064" y="562" class="txt-sm">Binance · OKX · 等</text>
  <rect x="40" y="600" width="1120" height="300" rx="6" fill="#fafafa" stroke="#ddd"/>
  <text x="600" y="628" font-size="14" font-weight="600" fill="#333" text-anchor="middle">主链（挖掘一条策略）</text>
  <text x="80" y="660" font-size="11" fill="#444">
    <tspan x="80" dy="0">Brief → /market-data-profile → /strategy-hypothesis → /quant-orchestrate</tspan>
    <tspan x="80" dy="22">→ /strategy-code-loop → /strategy-risk-control → /strategy-backtest-run → /strategy-backtest-analysis</tspan>
    <tspan x="80" dy="22">→ 达标：/strategy-report → L0 人工上盘（经各大交易所插件接实盘）</tspan>
  </text>
  <rect x="80" y="740" width="520" height="72" rx="4" fill="#eef2ff" stroke="#6366f1"/>
  <text x="340" y="768" font-size="12" font-weight="600" fill="#3730a3" text-anchor="middle">内环 /strategy-code-loop</text>
  <rect x="620" y="740" width="520" height="72" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="880" y="768" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">外环 /strategy-backtest-analysis-loop</text>
