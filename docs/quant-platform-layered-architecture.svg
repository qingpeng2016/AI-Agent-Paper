  <rect x="508" y="192" width="148" height="64" rx="4" class="box-agent"/>
  <text x="582" y="216" class="txt">④ 代码审查</text>
  <text x="582" y="234" class="txt-sm">Reviewer 异模型</text>
  <rect x="668" y="192" width="148" height="64" rx="4" class="box-agent"/>
