<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" font-family="PingFang SC, Microsoft YaHei, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #111; }
      .subtitle { font-size: 13px; fill: #444; }
      .layer-label { font-size: 12px; font-weight: 600; fill: #333; }
      .box-agent { fill: #d8d8d8; stroke: #888; stroke-width: 1.2; }
      .box-firmware { fill: #ececec; stroke: #aaa; stroke-width: 1.2; }
      .box-gate { fill: #2d6a4f; stroke: #1b4332; stroke-width: 1.2; }
      .box-plugin { fill: #f5f5f5; stroke: #bbb; stroke-width: 1.2; }
      .box-l0 { fill: #f0f4f8; stroke: #94a3b8; stroke-width: 1.2; }
      .bar { fill: #1d3557; stroke: #0d1b2a; stroke-width: 1.2; }
      .txt { font-size: 11px; fill: #222; text-anchor: middle; }
      .txt-sm { font-size: 10px; fill: #333; text-anchor: middle; }
      .txt-w { font-size: 11px; fill: #fff; text-anchor: middle; font-weight: 600; }
      .txt-w-sm { font-size: 10px; fill: #e0e0e0; text-anchor: middle; }
      .txt-gate { font-size: 11px; fill: #fff; text-anchor: middle; font-weight: 600; }
      .arrow { stroke: #666; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>
  <text x="600" y="36" class="title" text-anchor="middle">量化策略工厂 — 固件 + 插件 + 7 AI Agent</text>
  <text x="600" y="58" class="subtitle" text-anchor="middle">Agent 仅经 Skill 契约与 Tool API 调用下层；回测与 G1–G8 不由 LLM 签字</text>
  <text x="24" y="88" class="layer-label">L0 · 入口与人工闸门（平台）</text>
  <rect x="40" y="98" width="160" height="52" rx="4" class="box-l0"/>
  <text x="120" y="120" class="txt-sm">STRATEGY_BRIEF</text>
  <text x="120" y="136" class="txt-sm">研究任务入口</text>
  <path d="M200 124 L230 124" class="arrow"/>
  <rect x="230" y="98" width="200" height="52" rx="4" class="box-l0"/>
  <text x="330" y="118" class="txt-sm">候选门禁</text>
