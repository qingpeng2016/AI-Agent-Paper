  <text x="742" y="234" class="txt-sm">Validator</text>
  <rect x="828" y="192" width="148" height="64" rx="4" class="box-agent"/>
  <text x="902" y="216" class="txt">⑥ 因子与风控</text>
  <text x="902" y="234" class="txt-sm">Factor + Risk</text>
  <rect x="988" y="192" width="168" height="64" rx="4" class="box-agent"/>
