  <text x="995" y="458" class="txt-sm">risk.check</text>
  <rect x="1064" y="418" width="118" height="58" rx="4" class="box-firmware"/>
  <text x="1123" y="442" class="txt-sm">结果校验</text>
  <text x="1123" y="458" class="txt-sm">metrics diff</text>
  <path d="M600 476 L600 498" class="arrow"/>
