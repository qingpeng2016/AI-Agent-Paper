  <text x="343" y="458" class="txt-sm">Validation</text>
  <rect x="412" y="418" width="130" height="58" rx="4" class="box-gate"/>
  <text x="477" y="440" class="txt-gate">门槛判定</text>
  <text x="477" y="458" class="txt-gate">G1–G8 gate.judge</text>
  <rect x="552" y="418" width="118" height="58" rx="4" class="box-firmware"/>
  <text x="611" y="442" class="txt-sm">注册中心</text>
  <text x="611" y="458" class="txt-sm">Registry G1</text>
  <rect x="680" y="418" width="118" height="58" rx="4" class="box-firmware"/>
  <text x="739" y="442" class="txt-sm">试验登记</text>
  <text x="739" y="458" class="txt-sm">Trial Log</text>
  <rect x="808" y="418" width="118" height="58" rx="4" class="box-firmware"/>
  <text x="867" y="442" class="txt-sm">报告渲染</text>
  <text x="867" y="458" class="txt-sm">report.render</text>
  <rect x="936" y="418" width="118" height="58" rx="4" class="box-firmware"/>
